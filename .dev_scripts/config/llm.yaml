# LLM settings for `python -m uie.cli llm` (Phase 3).
#
# Opt-in: the command needs an API key in the environment. Any OpenAI-compatible
# chat-completions endpoint works (OpenAI, Azure, local servers, ...).

provider: openai
model: gpt-4o-mini
base_url: https://api.openai.com/v1

# Name of the environment variable holding the API key.
api_key_env: OPENAI_API_KEY

# Cap on controlled-vocabulary tags requested per paper.
max_tags: 5

# Response cache lifetime in seconds (default 30 days).
cache_ttl: 2592000
